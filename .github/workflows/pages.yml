# Builds and deploys the Vite `dist/` folder to GitHub Pages.
#
# Setup (once): Repo → Settings → Pages → Build and deployment → Source: GitHub Actions
#
# Site URL: https://<user>.github.io/<repo>/
# GITHUB_PAGES_BASE is set to /${{ github.event.repository.name }}/ so the same
# commit works in forks and in this repo (e.g. mathgpt-clone vs equation-ai).
name: Deploy GitHub Pages

on:
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
